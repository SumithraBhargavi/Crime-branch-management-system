<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>victim gender</title>
    <style>
        body {
            background-image: url("https://wallpapertag.com/wallpaper/full/5/4/0/505200-crime-scene-wallpaper-1920x1080-download-free.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        form {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px; 
            border-radius: 10px;
            text-align: center;
        }

        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            width: 100%;
            max-width: 300px; 
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <form action="MissingTable" method="post">
        <label for="gender">Select the gender of the victim: </label>
        <select name="gender" id="gender">
            <option value="select gender"><b>Select</b></option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
